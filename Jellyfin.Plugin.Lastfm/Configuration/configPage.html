<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Last.fm configuration</title>
</head>
<body>
    <div id="LastfmScrobblerConfigurationPage" data-role="page" class="page type-interior pluginConfigurationPage"
        data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="LastfmScrobblerConfigurationForm">
                    <div class="selectContainer">
                        <select is="emby-select" id="lastfmUser" label="Configure Last.fm for:"></select>
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" id="lastfmUsername" type="text" autocomplete="username" label="Last.fm username:" />
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" id="lastfmPassword" type="password" autocomplete="new-password" label="Last.fm password:" />
                        <div class="fieldDescription">Leave blank to keep the connected account. Enter a password to connect or change accounts.</div>
                        <div id="lastfmAccountStatus" role="status" aria-live="polite"></div>
                    </div>
                    <div class="checkboxContainer">
                        <label><input is="emby-checkbox" type="checkbox" id="lastfmScrobble" /><span>Enable scrobbling</span></label>
                    </div>
                    <div class="checkboxContainer">
                        <label><input is="emby-checkbox" type="checkbox" id="lastfmFavourites" /><span>Sync favourites</span></label>
                    </div>
                    <div class="checkboxContainer">
                        <label><input is="emby-checkbox" type="checkbox" id="lastfmAlternative" /><span>Use alternative scrobbling mode (Jellyfin playback-finished events)</span></label>
                    </div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span>Save</span></button>
                </form>
            </div>
        </div>
        <script>
            (function () {
                'use strict';
                const pluginId = '5e7fe7f0-b048-429e-a431-b1a7e69c930d';
                const page = document.getElementById('LastfmScrobblerConfigurationPage');
                const form = page.querySelector('form');
                const userSelect = page.querySelector('#lastfmUser');
                const usernameInput = page.querySelector('#lastfmUsername');
                const passwordInput = page.querySelector('#lastfmPassword');
                const scrobbleInput = page.querySelector('#lastfmScrobble');
                const favouritesInput = page.querySelector('#lastfmFavourites');
                const alternativeInput = page.querySelector('#lastfmAlternative');
                const status = page.querySelector('#lastfmAccountStatus');
                let configuration = { LastfmUsers: [] };
                let busy = false;
                function setBusy(value) {
                    busy = value;
                    form.querySelectorAll('input, select, button').forEach(function (element) { element.disabled = value; });
                    if (value) Dashboard.showLoadingMsg();
                    else Dashboard.hideLoadingMsg();
                }
                function populate() {
                    const account = (configuration.LastfmUsers || []).find(function (entry) { return entry.MediaBrowserUserId === userSelect.value; });
                    const options = account && account.Options || {};
                    usernameInput.value = account && account.Username || '';
                    passwordInput.value = '';
                    scrobbleInput.checked = !!options.Scrobble;
                    favouritesInput.checked = !!options.SyncFavourites;
                    alternativeInput.checked = !!options.AlternativeMode;
                    status.textContent = account && account.SessionKey ? 'Account connected.' : 'No account connected.';
                }
                page.addEventListener('pageshow', async function () {
                    if (busy) return;
                    setBusy(true);
                    try {
                        const selectedId = userSelect.value;
                        const result = await Promise.all([ApiClient.getPluginConfiguration(pluginId), ApiClient.getUsers()]);
                        configuration = result[0];
                        userSelect.replaceChildren();
                        result[1].forEach(function (user) {
                            const option = document.createElement('option');
                            option.value = user.Id;
                            option.textContent = user.Name;
                            userSelect.appendChild(option);
                        });
                        if (result[1].some(function (user) { return user.Id === selectedId; })) userSelect.value = selectedId;
                        populate();
                    } catch (_) {
                        Dashboard.alert('Could not load Last.fm settings. Please try again.');
                    } finally { setBusy(false); }
                });
                userSelect.addEventListener('change', populate);
                page.addEventListener('pagehide', function () { passwordInput.value = ''; });
                form.addEventListener('submit', async function (event) {
                    event.preventDefault();
                    if (busy || !userSelect.value) return;
                    const userId = userSelect.value;
                    const username = usernameInput.value.trim();
                    const password = passwordInput.value;
                    const options = { Scrobble: scrobbleInput.checked, SyncFavourites: favouritesInput.checked, AlternativeMode: alternativeInput.checked };
                    passwordInput.value = '';
                    setBusy(true);
                    try {
                        const latest = await ApiClient.getPluginConfiguration(pluginId);
                        latest.LastfmUsers = latest.LastfmUsers || [];
                        let account = latest.LastfmUsers.find(function (entry) { return entry.MediaBrowserUserId === userId; });
                        if (!account) {
                            account = { MediaBrowserUserId: userId, Username: '', SessionKey: '', Options: {} };
                            latest.LastfmUsers.push(account);
                        }
                        if (password) {
                            if (!username) { Dashboard.alert('Enter your Last.fm username.'); return; }
                            const response = await ApiClient.ajax({
                                type: 'POST', url: ApiClient.getUrl('Lastfm/Login'),
                                data: JSON.stringify({ username: username, password: password }),
                                contentType: 'application/json', dataType: 'json'
                            });
                            if (!response || !response.session || !response.session.key) {
                                Dashboard.alert('Could not connect to Last.fm. Check your credentials and try again.');
                                return;
                            }
                            account.Username = response.session.name;
                            account.SessionKey = response.session.key;
                        } else if (username !== (account.Username || '') || (!account.SessionKey && (options.Scrobble || options.SyncFavourites))) {
                            Dashboard.alert('Enter your Last.fm password to connect this account.');
                            return;
                        }
                        account.Options = Object.assign({}, account.Options, options);
                        const result = await ApiClient.updatePluginConfiguration(pluginId, latest);
                        configuration = latest;
                        populate();
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    } catch (_) {
                        Dashboard.alert('Could not save Last.fm settings. Check your connection and try again.');
                    } finally { setBusy(false); }
                });
            }());
        </script>
    </div>
</body>
</html>
