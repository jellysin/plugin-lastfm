---
id: "app-service"
name: "Application Backend Service"
description: "Production backend services and microservices exposing HTTP/gRPC
  APIs with structured telemetry and bounded concurrency"
runtime: "go"

complexity:
  max_cyclomatic: 12
  max_cognitive: 15
  max_func_loc: 80
  max_statements: 55

branch_protection:
  enforce_linear_history: true
  require_signed_commits: true
  required_approving_reviewers: 1
  dismiss_stale_reviews: true

supply_chain:
  slsa_level: 2
  enforce_cosign: true
  require_sbom: true

linters:
  - "govet"
  - "golangci-lint"
  - "semgrep"
  - "gitleaks"

devcontainer_features:
  - "ghcr.io/devcontainers/features/go:1"
  - "ghcr.io/devcontainers/features/docker-in-docker:4"
  - "ghcr.io/devcontainers/features/common-utils:2"
