---
# REUSE licensing gate, written by praetorctl adopt because the repository
# carries REUSE.toml or LICENSES/. It runs reuse lint at the release line the
# reuse-lint pre-commit job of lefthook.yml requires.
name: REUSE

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  reuse:
    name: REUSE lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: reuse lint
        if: github.event.pull_request.draft != true
        run: |
          python3 -m venv "$RUNNER_TEMP/praetor-reuse"
          "$RUNNER_TEMP/praetor-reuse/bin/python" -m pip install \
            --require-hashes -r .config/reuse/requirements.txt
          "$RUNNER_TEMP/praetor-reuse/bin/reuse" lint
