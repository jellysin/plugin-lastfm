name: Release automation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-automation
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    uses: jellysin/plugin-tooling/.github/workflows/release-please.yml@8beb2e91934cfa7ab3306eff9f6a6911f2278980 # v1.0.3
