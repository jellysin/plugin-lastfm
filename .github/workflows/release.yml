name: Publish exact release tag
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Require the exact tag to belong to reviewed main history
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate production application credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: |
          python - <<'PY'
          import os
          import re
          for name in ('LASTFM_API_KEY', 'LASTFM_SHARED_SECRET'):
              if not re.fullmatch(r'[a-fA-F0-9]{32}', os.environ.get(name, '')):
                  raise SystemExit('Missing or invalid project-owned Last.fm application credentials; publication is blocked')
          PY
      - name: Build production plugin from this exact tag
        env:
          CI: 'true'
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: |
          npm ci --ignore-scripts
          npm run build
          dotnet restore --locked-mode
          dotnet build src/JellySin.Plugin.Lastfm/JellySin.Plugin.Lastfm.csproj -c Release --no-restore
      - uses: jellysin/release-helper/actions/package@41f9ccffa1093d7dda8c3f7f634fad24d08cdc7a # v1.0.1
        id: package
        with:
          publish-directory: src/JellySin.Plugin.Lastfm/bin/Release/net10.0
          tag: ${{ github.ref_name }}
          nuget-lock-path: src/JellySin.Plugin.Lastfm/packages.lock.json
          nuget-assets-path: src/JellySin.Plugin.Lastfm/obj/project.assets.json
          runtime-dependencies-path: runtime-dependencies.json
      - name: Check out the pinned packaging implementation for production rebuilds
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jellysin/release-helper
          ref: 41f9ccffa1093d7dda8c3f7f634fad24d08cdc7a # v1.0.1
          path: build/repro-tooling
          persist-credentials: false
      - name: Verify production artifact reproducibility with the embedded application
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/reproduce.py --tooling-directory build/repro-tooling --tag "$RELEASE_TAG" --reference-directory dist
      - name: Attest every immutable release artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Verify bytes, resume missing draft uploads and publish
        uses: jellysin/release-helper/actions/publish@41f9ccffa1093d7dda8c3f7f634fad24d08cdc7a # v1.0.1
        with:
          directory: ${{ steps.package.outputs.directory }}
          tag: ${{ github.ref_name }}
          token: ${{ github.token }}
