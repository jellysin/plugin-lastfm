name: Publish exact release tag
# The tag build runs in the reusable signing workflow, so provenance, the SBOM attestation
# and the cosign signatures name build-signed.yml at this tag. The publish job checks them
# with the same verify-signed action the rehearsal uses and publishes only verified bytes.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build-signed.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      tag: ${{ github.ref_name }}
    secrets:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
      - uses: ./.github/actions/verify-signed
      - name: Verify bytes, resume missing draft uploads and publish
        uses: jellysin/release-helper/actions/publish@f1ffebfa67f8b8f37d94b8fc22174e9f75dbd28e # v1.2.3
        with:
          directory: dist
          tag: ${{ github.ref_name }}
          token: ${{ github.token }}
          # build-signed.yml builds and attests the artifacts; this workflow only publishes them.
          signer-workflow: .github/workflows/build-signed.yml
