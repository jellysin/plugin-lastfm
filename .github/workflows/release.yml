name: Release

on:
  push:
    branches: [main, release/10.11]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag whose publication should resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref_name == 'main' || github.ref_name == 'release/10.11'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      tag: ${{ steps.result.outputs.tag }}
      sha: ${{ steps.result.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare releases and release PRs
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: ${{ github.ref_name }}
          config-file: ${{ github.ref_name == 'release/10.11' && 'release-please-maintenance.json' || 'release-please-config.json' }}
          manifest-file: .release-please-manifest.json
      - name: Dispatch CI for release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: python tools/github_release.py dispatch-ci --prs "$RELEASE_PRS"
      - name: Select immutable publication input
        id: result
        env:
          INPUT_TAG: ${{ inputs.tag }}
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
          CREATED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'tools')
          import release
          tag = os.environ['INPUT_TAG'] or os.environ['CREATED_TAG']
          if tag:
              release.validate_tag(tag)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  print(f'tag={tag}', file=output)
                  print(f"sha={os.environ['CREATED_SHA']}", file=output)
          PY

  verify:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    with:
      source_ref: ${{ needs.prepare.outputs.tag }}
      expected_sha: ${{ needs.prepare.outputs.sha }}
      release_tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ needs.verify.outputs.commit }}
          path: build/release
      - name: Revalidate source and downloaded asset checksums
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.verify.outputs.commit }}
        run: |
          python tools/github_release.py verify-package --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
          python tools/github_release.py provenance --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
      - name: Attest verified plugin provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release/*.zip
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: build/provenance.json
      - name: Publish verified immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.verify.outputs.commit }}
        run: python tools/github_release.py publish --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"

  catalog:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: plugin-catalog
      cancel-in-progress: false
    permissions:
      contents: write
      checks: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Reconcile all published releases through a catalog PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/github_release.py catalog
