name: Dependency audit
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print the issue instead of opening it
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    name: Audit the web lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry-run && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      # Pull requests gate on production dependencies only. This run includes development
      # dependencies: findings fail it and are tracked in one issue; a run that cannot open
      # or update that issue fails with exit status 2.
      - name: Audit with development dependencies and track findings
        run: |
          python tools/dependency_audit.py --self-test
          python tools/dependency_audit.py ${DRY_RUN:+--dry-run}
