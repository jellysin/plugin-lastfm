name: Build, attest and sign the plugin
# Reusable build: the job that compiles the plugin also writes its provenance, the SBOM
# attestation and the cosign signatures, so the signing identity is this file and not the
# workflow that calls it. The caller verifies the uploaded result in a separate job.
on:
  workflow_call:
    outputs:
      artifact:
        description: Name of the uploaded artifact holding dist/ and signatures/.
        value: ${{ jobs.build.outputs.artifact }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact: signed-build-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build the plugin
        env:
          CI: 'true'
        run: |
          npm ci --ignore-scripts
          npm run build
          dotnet restore --locked-mode
          dotnet build src/JellySin.Plugin.Lastfm/JellySin.Plugin.Lastfm.csproj -c Release --no-restore
      - name: Package the plugin, release metadata, checksums and SPDX SBOM
        uses: jellysin/release-helper/actions/package@043c6288642b0734ba53e46603a02cfdb3ca0014 # v1.2.2
        with:
          publish-directory: src/JellySin.Plugin.Lastfm/bin/Release/net10.0
          nuget-lock-path: src/JellySin.Plugin.Lastfm/packages.lock.json
          nuget-assets-path: src/JellySin.Plugin.Lastfm/obj/project.assets.json
          runtime-dependencies-path: runtime-dependencies.json
          changelog-path: CHANGELOG.md
      - name: Attest build provenance for every artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attest the release-helper SBOM for the plugin archive
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.zip
          sbom-path: dist/sbom.spdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign every artifact with cosign keyless
        run: |
          mkdir signatures
          for file in dist/*; do
            cosign sign-blob --yes --bundle "signatures/$(basename "$file").sigstore.json" "$file"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-build-${{ github.run_id }}
          path: |
            dist
            signatures
          if-no-files-found: error
          retention-days: 1
