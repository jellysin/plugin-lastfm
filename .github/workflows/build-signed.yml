name: Build, attest and sign the plugin
# Reusable build: the job that compiles the plugin also writes its provenance, the SBOM
# attestation and the cosign signatures, so the signing identity is this file and not the
# workflow that calls it. The caller verifies the uploaded result in a separate job.
# With a tag, the build is the production release: it requires the project's Last.fm
# application, the tag on main history and two identical independent rebuilds.
on:
  workflow_call:
    inputs:
      tag:
        description: Exact vX.Y.Z release tag checked out by the caller; empty for a rehearsal.
        type: string
        default: ''
    secrets:
      LASTFM_API_KEY:
        required: false
      LASTFM_SHARED_SECRET:
        required: false
    outputs:
      artifact:
        description: Name of the uploaded artifact holding dist/ and signatures/.
        value: ${{ jobs.build.outputs.artifact }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact: signed-build-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: inputs.tag != ''
        with:
          python-version-file: .python-version
      - name: Require the exact tag to belong to reviewed main history
        if: inputs.tag != ''
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate production application credentials
        if: inputs.tag != ''
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: |
          python - <<'PY'
          import os
          import re
          for name in ('LASTFM_API_KEY', 'LASTFM_SHARED_SECRET'):
              if not re.fullmatch(r'[a-fA-F0-9]{32}', os.environ.get(name, '')):
                  raise SystemExit('Missing or invalid project-owned Last.fm application credentials; publication is blocked')
          PY
      - name: Build the plugin
        env:
          CI: 'true'
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: |
          npm ci --ignore-scripts
          npm run build
          dotnet restore --locked-mode
          dotnet build src/JellySin.Plugin.Lastfm/JellySin.Plugin.Lastfm.csproj -c Release --no-restore
      - name: Package the plugin, release metadata, checksums and SPDX SBOM
        uses: jellysin/release-helper/actions/package@c0f6e472f9ac4da2ccdd10afd0a7a167d938b566 # v1.6.0
        with:
          publish-directory: src/JellySin.Plugin.Lastfm/bin/Release/net10.0
          tag: ${{ inputs.tag }}
          nuget-lock-path: src/JellySin.Plugin.Lastfm/packages.lock.json
          nuget-assets-path: src/JellySin.Plugin.Lastfm/obj/project.assets.json
          runtime-dependencies-path: runtime-dependencies.json
          changelog-path: CHANGELOG.md
      - name: Check out the pinned packaging implementation for production rebuilds
        if: inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jellysin/release-helper
          ref: c0f6e472f9ac4da2ccdd10afd0a7a167d938b566 # v1.6.0
          path: build/repro-tooling
          persist-credentials: false
      - name: Verify production artifact reproducibility with the embedded application
        if: inputs.tag != ''
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python tools/reproduce.py --tooling-directory build/repro-tooling --tag "$RELEASE_TAG" --reference-directory dist
      - name: Attest build provenance for every artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attest the release-helper SBOM for the plugin archive
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.zip
          sbom-path: dist/sbom.spdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign every artifact with cosign keyless
        run: |
          mkdir signatures
          for file in dist/*; do
            cosign sign-blob --yes --bundle "signatures/$(basename "$file").sigstore.json" "$file"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-build-${{ github.run_id }}
          path: |
            dist
            signatures
          if-no-files-found: error
          retention-days: 1
