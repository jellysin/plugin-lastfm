name: Recover the attested first release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-refs/tags/v1.0.0
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Check out the unchanged first release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ae3b4b19ecc0f41761760c73a8c9910664815920
          fetch-depth: 0
          persist-credentials: false
      - name: Require the original tag and reviewed source
        run: |
          test "$(git rev-parse HEAD)" = ae3b4b19ecc0f41761760c73a8c9910664815920
          test "$(git rev-parse 'refs/tags/v1.0.0^{commit}')" = ae3b4b19ecc0f41761760c73a8c9910664815920
          git merge-base --is-ancestor HEAD origin/main
          git merge-base --is-ancestor HEAD "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Validate the same project application credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: |
          python - <<'PY'
          import os
          import re
          for name in ('LASTFM_API_KEY', 'LASTFM_SHARED_SECRET'):
              if not re.fullmatch(r'[a-fA-F0-9]{32}', os.environ.get(name, '')):
                  raise SystemExit('Missing or invalid project application credentials')
          PY
      - name: Rebuild the exact original source
        env:
          CI: 'true'
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: |
          npm ci --ignore-scripts
          npm run build
          dotnet restore --locked-mode
          dotnet build src/JellySin.Plugin.Lastfm/JellySin.Plugin.Lastfm.csproj -c Release --no-restore
      - name: Package with the original release implementation
        uses: jellysin/release-helper/actions/package@41f9ccffa1093d7dda8c3f7f634fad24d08cdc7a # v1.0.1
        id: package
        with:
          publish-directory: src/JellySin.Plugin.Lastfm/bin/Release/net10.0
          tag: v1.0.0
          nuget-lock-path: src/JellySin.Plugin.Lastfm/packages.lock.json
          nuget-assets-path: src/JellySin.Plugin.Lastfm/obj/project.assets.json
          runtime-dependencies-path: runtime-dependencies.json
      - name: Check out the original reproducibility implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jellysin/release-helper
          ref: 41f9ccffa1093d7dda8c3f7f634fad24d08cdc7a # v1.0.1
          path: build/repro-tooling
          persist-credentials: false
      - name: Verify two independent production rebuilds
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: python tools/reproduce.py --tooling-directory build/repro-tooling --tag v1.0.0 --reference-directory dist
      - name: Require the four original attested subject digests
        working-directory: dist
        run: |
          sha256sum --check <<'SHA256'
          bbd13d4514d76a1cd61aa80608f32fd44dc75b87059fcec96f2b5e4c6664775d  jellyfin-plugin-lastfm-1.0.0.zip
          9765f19daae38453c2397f119d1579f177f41a3f470ce30124a3d1a307ab676b  release.json
          a74248702fd3018758df89e12634b951e2915b33e0b68caf72ce636f43e539c5  sbom.spdx.json
          a8141a3390c78f11260cbc7532734d1fda15bd2a7cbd052bf136a05e74a5190c  checksums.txt
          SHA256
      - name: Verify original tag attestations before recovering the existing draft
        # Original subjects: https://github.com/jellysin/jellyfin-plugin-lastfm/attestations/45962373
        uses: jellysin/release-helper/actions/publish@8beb2e91934cfa7ab3306eff9f6a6911f2278980 # v1.0.3
        with:
          directory: ${{ steps.package.outputs.directory }}
          tag: v1.0.0
          verified-tag-recovery: 'true'
          token: ${{ github.token }}
