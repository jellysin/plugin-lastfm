name: Rehearse release signing
# Builds main through the reusable signing workflow and verifies provenance, the SBOM
# attestation and the cosign signatures in a separate job, with the same verify-signed action
# that release.yml runs before it publishes. It creates no tag, release or
# draft, and the artifact expires after one day. With tamper set, one byte is appended to
# the archive before verification, and the run must fail.
on:
  workflow_dispatch:
    inputs:
      tamper:
        description: Append one byte to the archive before verification (the run must fail)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-rehearsal
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-signed.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Tamper with the archive
        if: inputs.tamper
        run: |
          for file in dist/*.zip; do printf 'x' >> "$file"; done
      - uses: ./.github/actions/verify-signed
