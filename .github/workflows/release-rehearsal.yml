name: Rehearse release signing
# Builds main through the reusable signing workflow and verifies provenance, the SBOM
# attestation and the cosign signatures in a separate job. It creates no tag, release or
# draft, and the artifact expires after one day. With tamper set, one byte is appended to
# the archive before verification, and the run must fail.
on:
  workflow_dispatch:
    inputs:
      tamper:
        description: Append one byte to the archive before verification (the run must fail)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-rehearsal
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-signed.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Tamper with the archive
        if: inputs.tamper
        run: |
          for file in dist/*.zip; do printf 'x' >> "$file"; done
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify provenance and the SBOM attestation with gh attestation verify
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER: ${{ github.repository }}/.github/workflows/build-signed.yml
        run: |
          for file in dist/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
          for file in dist/*.zip; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" --source-ref "$GITHUB_REF" --deny-self-hosted-runners --predicate-type https://spdx.dev/Document/v2.3
          done
      - name: Verify the cosign signatures with cosign verify-blob
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/build-signed.yml@${{ github.ref }}
        run: |
          for file in dist/*; do
            cosign verify-blob --bundle "signatures/$(basename "$file").sigstore.json" --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$file"
          done
