---
version: 1
repository:
  owner: jellysin
  name: plugin-lastfm
  visibility: public
  description: "Last.fm integration for Jellyfin 12"
  homepage: ""
  topics: []
profiles:
  - app-service
# Agent clients and editors in use. Praetor generates and verifies files of these only.
agent_clients:
  - claude
  - codex
  - gemini
editors:
  - universal
  - vscode
  - antigravity
facets:
  - security:high
  - agent:sandboxed
# One maintainer: review mode renders zero required approvals. The count stays, so that
# restoring independent review keeps the minimum.
overrides:
  branch_protection:
    required_approving_reviewers: 1
    review_mode: single_maintainer
register:
  sources:
    expected: 13
    sha256:
      sha256:530d5c2a5a78d0b3861b257d587ef50a2c7092518078aa16430b1f2f19c4619c
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
exceptions:
  # Category D (120 days): the backend complexity policy differs from HISS-04 by design (#153).
  - rule: HISS-04
    glob: src/**/*.cs
    category: D
    entered: "2026-10-26"
    expires: "2027-02-23"
    reason: >-
      Category D. tools/JellySin.CodePolicy enforces the backend function limits (120 lines,
      60 statements, cognitive complexity 30 via Sonar S3776) in make verify-all; HISS-04
      caps functions at 60 lines, 55 statements and cognitive complexity 15. Review the two
      limits again at expiry (#153).
