---
version: 1
repository:
  owner: jellysin
  name: plugin-lastfm
  visibility: public
  description: "Last.fm integration for Jellyfin 12"
  homepage: ""
  topics: []
profiles:
  - app-service
# Agent clients and editors in use. Praetor generates and verifies files of these only.
agent_clients:
  - claude
  - codex
  - gemini
editors:
  - universal
  - vscode
  - antigravity
facets:
  - security:high
  - agent:sandboxed
# One maintainer: review mode renders zero required approvals. The count stays, so that
# restoring independent review keeps the minimum.
overrides:
  branch_protection:
    required_approving_reviewers: 1
    review_mode: single_maintainer
register:
  sources:
    expected: 13
    sha256:
      sha256:530d5c2a5a78d0b3861b257d587ef50a2c7092518078aa16430b1f2f19c4619c
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
release:
  e2e:
    since: 2fc207e3e3fa17b8504786d78b93c4044c561f32
  test_levels:
    unit:
      paths:
        - "tests/JellySin.Plugin.Lastfm.Tests/**/*Tests.cs"
        - "tests/python/test_*.py"
        - "tests/web/*.test.mjs"
      job: "checks"
      run: "dotnet test tests/JellySin.Plugin.Lastfm.Tests/"
    integration:
      paths:
        - "tests/integration/native_userdata.py"
      job: "checks"
      run: "tests/integration/native_userdata.py"
    e2e:
      paths:
        - "tests/integration/page_check.py"
        - "tests/integration/proxied_sign_in.py"
        - "tests/integration/settings_entry.py"
      job: "checks"
      run: "tests/integration/page_check.py"
    load_soak:
      paths:
        - "tools/library_load.py"
        - "tools/smoke.py"
      job: "checks"
      run: "tools/library_load.py"
    recovery_restore:
      paths:
        - "tests/integration/state_carryover.py"
        - "tests/integration/catalog_over_canary.py"
      job: "carryover"
      run: "tests/integration/state_carryover.py"
